name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `toolchain:` input -- reads rust-toolchain.toml at repo root, so CI
      # and local dev always build with the exact same pinned version instead
      # of whatever "stable" happens to resolve to on the runner that day. See
      # the toolchain file for why: a `stable` bump mid-project (1.96 -> 1.98)
      # silently enabled a brand-new clippy lint under -D warnings and broke
      # every open PR's CI with no warning.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Cheapest check first -- fails in seconds, before the multi-minute
      # build, when a PR forgot to run `cargo fmt`. rustfmt itself comes from
      # rust-toolchain.toml's `components`, so it's the same pinned version
      # locally and here.
      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --locked --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Several tests exercise real Windows APIs (D3D11 device creation, window
      # enumeration, WASAPI) rather than mocks, on the assumption that
      # windows-latest's hosted runner supports enough of a display/GPU stack
      # for this -- has not been previously verified. If hardware-dependent
      # tests fail here, that's a real signal worth investigating, not
      # something to silently skip.
      - name: Test
        run: cargo test --locked

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit

      # RUSTSEC-2026-0192 (ttf-parser, unmaintained) is pulled in only via
      # winit's Linux/Wayland backend (sctk-adwaita -> ab_glyph) -- this app
      # is Windows-only, so that code path never compiles into the shipped
      # binary. Confirmed via `cargo tree --target all -i <crate>`. Ignored
      # here rather than left unscanned, so any NEW advisory against
      # something actually reachable on Windows still fails this step.
      # Only ignore advisories that still match Cargo.lock: the old
      # quick-xml ignores (RUSTSEC-2026-0194/0195) were dropped once
      # quick-xml 0.41.0 (patched) landed, so a regression back to a
      # vulnerable version fails here instead of being silently ignored.
      - name: Security audit
        run: cargo audit --ignore RUSTSEC-2026-0192

  # Every release build is a `push: tags: v*.*.*` run -- its own cache scope,
  # distinct from every other tag and from main (GitHub Actions only lets a
  # run restore a cache from its own ref, a PR's base branch, or the default
  # branch). Without this, every release tag was a cold, from-scratch build
  # (~8min just for "Build release binary", confirmed via a run log showing
  # "No cache found." then a full ~250-crate rebuild). This job builds the
  # same --release profile on every push to main and saves under the same
  # shared-key release.yml's cache step uses, so a release tag pushed shortly
  # after its version-bump commit lands on main restores from here instead.
  # Gated to push (not pull_request): a PR's cache scope can't help main's
  # release builds anyway, so running this on every PR would just double CI
  # time for no benefit.
  prime-release-cache:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-windows

      - name: Build release binary (cache warm-up for release.yml)
        run: cargo build --release --locked
