name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build
        run: cargo build --locked --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Several tests exercise real Windows APIs (D3D11 device creation, window
      # enumeration, WASAPI) rather than mocks, on the assumption that
      # windows-latest's hosted runner supports enough of a display/GPU stack
      # for this -- has not been previously verified. If hardware-dependent
      # tests fail here, that's a real signal worth investigating, not
      # something to silently skip.
      - name: Test
        run: cargo test --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # RUSTSEC-2026-0194/0195 (quick-xml) and RUSTSEC-2026-0192 (ttf-parser,
      # unmaintained) are pulled in only via winit's Linux/Wayland backend
      # (sctk-adwaita -> smithay-client-toolkit / ab_glyph) -- this app is
      # Windows-only, so that code path never compiles into the shipped
      # binary. Confirmed via `cargo tree --target all -i <crate>`. Ignored
      # here rather than left unscanned, so any NEW advisory against
      # something actually reachable on Windows still fails this step.
      - name: Security audit
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0192
