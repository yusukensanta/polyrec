name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --locked --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Several tests exercise real Windows APIs (D3D11 device creation, window
      # enumeration, WASAPI) rather than mocks, on the assumption that
      # windows-latest's hosted runner supports enough of a display/GPU stack
      # for this -- has not been previously verified. If hardware-dependent
      # tests fail here, that's a real signal worth investigating, not
      # something to silently skip.
      - name: Test
        run: cargo test --locked

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-audit

      # RUSTSEC-2026-0194/0195 (quick-xml) and RUSTSEC-2026-0192 (ttf-parser,
      # unmaintained) are pulled in only via winit's Linux/Wayland backend
      # (sctk-adwaita -> smithay-client-toolkit / ab_glyph) -- this app is
      # Windows-only, so that code path never compiles into the shipped
      # binary. Confirmed via `cargo tree --target all -i <crate>`. Ignored
      # here rather than left unscanned, so any NEW advisory against
      # something actually reachable on Windows still fails this step.
      - name: Security audit
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0192

  # Every release build is a `push: tags: v*.*.*` run -- its own cache scope,
  # distinct from every other tag and from main (GitHub Actions only lets a
  # run restore a cache from its own ref, a PR's base branch, or the default
  # branch). Without this, every release tag was a cold, from-scratch build
  # (~8min just for "Build release binary", confirmed via a run log showing
  # "No cache found." then a full ~250-crate rebuild). This job builds the
  # same --release profile on every push to main and saves under the same
  # shared-key release.yml's cache step uses, so a release tag pushed shortly
  # after its version-bump commit lands on main restores from here instead.
  # Gated to push (not pull_request): a PR's cache scope can't help main's
  # release builds anyway, so running this on every PR would just double CI
  # time for no benefit.
  prime-release-cache:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-windows

      - name: Build release binary (cache warm-up for release.yml)
        run: cargo build --release --locked
