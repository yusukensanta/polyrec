name: Size experiment (not for merge)

"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  size:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            lto: "off"
            units: "256"
          - name: thin16
            lto: "thin"
            units: "16"
          - name: fat1
            lto: "fat"
            units: "1"
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - name: Build
        shell: pwsh
        run: |
          $t = Measure-Command { cargo build --release --locked }
          $size = (Get-Item target/release/polyrec.exe).Length
          "RESULT ${{ matrix.name }}: $size bytes ($([math]::Round($size/1MB,2)) MB), cold build $([math]::Round($t.TotalMinutes,1)) min" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
