name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        shell: pwsh
        run: |
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($cargoVersion -ne $tagVersion) {
            Write-Error "Tag v$tagVersion does not match Cargo.toml's version ($cargoVersion) -- bump Cargo.toml and retag."
            exit 1
          }

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $stagingDir = "polyrec-$ver-windows-x64"
          New-Item -ItemType Directory -Path $stagingDir | Out-Null
          Copy-Item target/release/polyrec.exe $stagingDir/
          Copy-Item README.md $stagingDir/
          Copy-Item LICENSE $stagingDir/
          Compress-Archive -Path $stagingDir/* -DestinationPath "$stagingDir.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: polyrec-*.zip
          generate_release_notes: true
