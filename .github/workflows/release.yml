name: Release

# A pushed v*.*.* tag builds that release and leaves it as a DRAFT: nobody
# (and no copy of PolyRec checking for updates) sees it yet. The maintainer
# then runs .github/scripts/Sign-Release.ps1 locally (a copy kept outside
# the repo), which checks what this built and what changed since the last
# release, signs its SHA256SUMS.txt with the release key -- kept off GitHub,
# so nothing here can produce that signature -- uploads the signature and
# publishes the release. PolyRec only installs an update whose checksums
# carry it (self_update::verify_signed_sums).
#
# Every release is signed that way, by the maintainer running the script
# by hand (CONTRIBUTING.md, Release Process). Don't add a step, workflow
# or bot that signs SHA256SUMS.txt or publishes the release.
#
# There's deliberately no `release: published` trigger: publishing the
# signed draft would set this off again, and a rebuild uploading different
# bytes over the signed ones would break the signature (immutable releases
# then block that anyway).
"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # For actions/attest-build-provenance: id-token to mint the OIDC token that
  # proves "this exact repo/workflow/commit produced this file", attestations
  # to publish the resulting attestation. Neither grants any write access to
  # repo content beyond that.
  id-token: write
  attestations: write

# A tag pushed again (deleted and re-pushed) queues behind the run already
# under way rather than racing it for the same release's assets.
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  build-and-release:
    runs-on: windows-latest
    # A cold build takes about 10 min, and each SignPath request waits up to
    # 30 min for approval (Submit-SignPathRequest.ps1), two of them.
    timeout-minutes: 90
    steps:
      # Pinned to a commit SHA, not a mutable version tag -- a compromised or
      # re-tagged upstream action can't silently swap in different code this
      # way. Comment notes the version the SHA corresponds to, for humans and
      # for Dependabot to track updates against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Nothing here pushes with git (the release is made through the
        # API), so the contents: write token isn't left in .git/config for
        # the ~250 crates' build scripts that run after this to find.
        with:
          persist-credentials: false

      - name: Resolve tag
        id: tag
        shell: pwsh
        # Passed through env instead of splicing ${{ }} directly into the
        # script body -- a ref name is text whoever pushed it chose, and this
        # job holds id-token/attestations write plus a signing secret, so
        # textual interpolation into a run: block here would be a
        # script-injection vector. env vars are passed as data, not parsed
        # as script.
        env:
          RESOLVE_REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:RESOLVE_REF_NAME
          # The trigger's v*.*.* glob also matches names like
          # v1.2.3$(...) -- git allows $ ( ) ' | in a ref. Only a plain
          # vX.Y.Z goes on: it becomes file names, and the steps below get
          # it as $env:TAG, never spliced into their scripts.
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+\z') {
            Write-Error "Not a release tag: '$tag' -- expected vX.Y.Z"
            exit 1
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # dtolnay/rust-toolchain doesn't tag releases -- "stable" is a real,
      # continuously-updated branch in that repo (this is its documented
      # normal usage), so pinning here means the exact commit currently at
      # the tip of that branch rather than a version. No `toolchain:` input,
      # same reasoning as ci.yml -- reads rust-toolchain.toml so a release
      # build always uses the exact Rust version CI already verified against.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch

      # A tag push is its own cache scope, distinct from every other tag and
      # from main -- GitHub Actions only lets a run restore a cache from its
      # own ref, a PR's base branch, or the default branch, so without a
      # shared-key every release tag was a cold, from-scratch build (~8min
      # just for "Build release binary", confirmed via the run log showing
      # "No cache found." then a full dependency rebuild). `ci.yml`'s
      # prime-release-cache job builds this same profile on every push to
      # main and saves under this same shared-key, which as the default
      # branch's cache IS visible here -- so a release tag pushed shortly
      # after its version-bump commit lands on main restores that cache
      # instead of rebuilding ~250 crates from scratch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-windows

      - name: Verify tag matches Cargo.toml version
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tagVersion = $env:TAG.TrimStart('v')
          if ($cargoVersion -ne $tagVersion) {
            Write-Error "Tag v$tagVersion does not match Cargo.toml's version ($cargoVersion) -- bump Cargo.toml and retag."
            exit 1
          }

      - name: Build release binary
        run: cargo build --release --locked

      # Signs polyrec.exe itself, in place, before it goes into the zip (and,
      # via installer/polyrec.iss's [Files] entry, before Inno Setup bundles
      # this exact file into the installer too -- one signed exe, reused by
      # both artifacts). Calls SignPath's plain REST API directly (see
      # .github/scripts/Submit-SignPathRequest.ps1) rather than SignPath's
      # GitHub Actions connector/action -- that connector requires a
      # "Trusted Build System" linked at the organization level, which isn't
      # available on the free/Foundation OSS tier this project's certificate
      # comes from. The generic REST API has no such requirement.
      # continue-on-error: SignPath's free/Foundation OSS tier has a yearly
      # artifact-size quota -- exceeding it (or a stuck manual-approval,
      # etc.) previously failed this step and skipped every step after it
      # (Package zip onward), meaning the whole release silently never
      # happened. Signing is a nice-to-have (avoids the SmartScreen
      # "Unknown Publisher" warning) but shouldn't be able to block
      # shipping entirely -- a failure here now just leaves the exe
      # unsigned and the release continues. See the "Note unsigned
      # artifacts" step below for how that's surfaced. The quota has been
      # used up since mid-2026, so releases currently ship unsigned (see
      # SECURITY.md); SHA256SUMS.txt and the provenance attestation below
      # are what a download is verified by.
      - name: Sign polyrec.exe
        id: sign_exe
        shell: pwsh
        continue-on-error: true
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          . .github/scripts/Submit-SignPathRequest.ps1
          Submit-SignPathRequest `
            -ArtifactPath target/release/polyrec.exe `
            -ArtifactConfigurationSlug polyrec-exe `
            -Description "$env:TAG polyrec.exe" `
            -OutputPath target/release/polyrec.exe

      - name: Package zip
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $ver = $env:TAG
          $stagingDir = "polyrec-$ver-windows-x64"
          New-Item -ItemType Directory -Path $stagingDir | Out-Null
          Copy-Item target/release/polyrec.exe $stagingDir/
          Copy-Item README.md $stagingDir/
          Copy-Item LICENSE $stagingDir/
          Copy-Item assets/fonts/OFL.txt $stagingDir/LICENSE-IBM-Plex.txt
          Compress-Archive -Path $stagingDir/* -DestinationPath "$stagingDir.zip"

      # Alternative to the portable zip for users who don't want to unzip and
      # locate an exe themselves -- a normal double-click installer with a
      # Start Menu shortcut and Add/Remove Programs entry. Inno Setup ships
      # preinstalled on the windows-latest runner image, no extra setup step
      # needed. The zip keeps being published too -- it's what winget/Scoop
      # style package managers expect.
      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $ver = $env:TAG
          iscc "/DMyAppVersion=$ver" installer\polyrec.iss
          "installerPath=polyrec-$ver-windows-x64-setup.exe" >> $env:GITHUB_OUTPUT
        id: installer

      # Separate signing request from polyrec.exe's -- the installer is its
      # own PE file (with its own Authenticode signature slot), signed
      # independently even though the exe it contains is already signed too.
      # See the continue-on-error comment on "Sign polyrec.exe" above --
      # same reasoning applies here.
      - name: Sign installer
        id: sign_installer
        shell: pwsh
        continue-on-error: true
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          INSTALLER_PATH: ${{ steps.installer.outputs.installerPath }}
        run: |
          . .github/scripts/Submit-SignPathRequest.ps1
          Submit-SignPathRequest `
            -ArtifactPath $env:INSTALLER_PATH `
            -ArtifactConfigurationSlug polyrec-installer `
            -Description "$env:TAG installer" `
            -OutputPath $env:INSTALLER_PATH

      # Surfaces a signing failure in the workflow run summary -- easy to
      # miss otherwise, since continue-on-error only shows as a small
      # yellow warning icon on the step itself, and the released files
      # being unsigned isn't otherwise called out anywhere.
      - name: Note unsigned artifacts
        if: steps.sign_exe.outcome == 'failure' || steps.sign_installer.outcome == 'failure'
        shell: pwsh
        run: |
          "## :warning: Release published with unsigned artifacts" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- polyrec.exe signing: ${{ steps.sign_exe.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- installer signing: ${{ steps.sign_installer.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Likely a SignPath quota/approval issue -- check the failed step's log. Downloaders will see a Windows SmartScreen ""Unknown Publisher"" warning until a future release signs successfully." >> $env:GITHUB_STEP_SUMMARY

      - name: Generate checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem polyrec-*.zip, polyrec-*-setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          # LF line endings (Out-File would write CRLF), so the standard
          # `sha256sum -c SHA256SUMS.txt` works on Linux/macOS/Git Bash too.
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt

      # Cryptographically ties this exact file to this exact repo/workflow/commit,
      # recorded in Sigstore's public transparency log -- independent of the
      # release itself, so it can't be silently re-issued alongside a swapped
      # asset the way a checksum committed only to the release body could be.
      # Verify a downloaded file with: gh attestation verify <file> -R yusukensanta/polyrec
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            polyrec-*.zip
            polyrec-*-setup.exe

      # A draft, published once its checksums are signed (see the top of
      # this file): GitHub's "latest release", which PolyRec checks for
      # updates, never includes drafts.
      - name: Create/update GitHub Release (draft)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: true
          files: |
            polyrec-*.zip
            polyrec-*-setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
