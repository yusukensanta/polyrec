name: Release

# Two independent triggers, since both are valid ways to cut a release:
# 1. push a v*.*.* tag directly -- softprops/action-gh-release creates the
#    GitHub Release itself in that case.
# 2. publish a Release through the GitHub UI/API against an existing tag --
#    no new tag push happens, so trigger 1 alone would never fire for this.
#    action-gh-release detects the already-existing release by tag name and
#    just uploads the zip to it instead of erroring.
"on":
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

permissions:
  contents: write
  # For actions/attest-build-provenance: id-token to mint the OIDC token that
  # proves "this exact repo/workflow/commit produced this file", attestations
  # to publish the resulting attestation. Neither grants any write access to
  # repo content beyond that.
  id-token: write
  attestations: write

# Creating a Release via the GitHub UI against a brand-new tag fires BOTH
# triggers above (the tag push, then the release publish) -- queue the second
# run instead of letting it race the first for the same release's assets.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      # Pinned to a commit SHA, not a mutable version tag -- a compromised or
      # re-tagged upstream action can't silently swap in different code this
      # way. Comment notes the version the SHA corresponds to, for humans and
      # for Dependabot to track updates against.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "release") {
            "${{ github.event.release.tag_name }}"
          } else {
            "${{ github.ref_name }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # dtolnay/rust-toolchain doesn't tag releases -- "stable" is a real,
      # continuously-updated branch in that repo (this is its documented
      # normal usage), so pinning here means the exact commit currently at
      # the tip of that branch rather than a version.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Verify tag matches Cargo.toml version
        shell: pwsh
        run: |
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tagVersion = "${{ steps.tag.outputs.tag }}".TrimStart('v')
          if ($cargoVersion -ne $tagVersion) {
            Write-Error "Tag v$tagVersion does not match Cargo.toml's version ($cargoVersion) -- bump Cargo.toml and retag."
            exit 1
          }

      - name: Build release binary
        run: cargo build --release --locked

      # Signs polyrec.exe itself, in place, before it goes into the zip (and,
      # via installer/polyrec.iss's [Files] entry, before Inno Setup bundles
      # this exact file into the installer too -- one signed exe, reused by
      # both artifacts). SignPath's free OSS tier requires build-origin
      # verification on every signing request; the GitHub Action (rather
      # than calling Submit-SigningRequest directly) supplies that
      # automatically from the workflow run itself.
      - name: Upload unsigned exe for signing
        id: upload-unsigned-exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-polyrec-exe
          path: target/release/polyrec.exe

      - name: Sign polyrec.exe
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: decb64a5-8938-4442-8848-36981e8328f0
          project-slug: polyrec
          signing-policy-slug: polyrec
          artifact-configuration-slug: polyrec-exe
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/exe

      - name: Replace unsigned exe with the signed one
        shell: pwsh
        run: Copy-Item signed/exe/polyrec.exe target/release/polyrec.exe -Force

      - name: Package zip
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.tag }}"
          $stagingDir = "polyrec-$ver-windows-x64"
          New-Item -ItemType Directory -Path $stagingDir | Out-Null
          Copy-Item target/release/polyrec.exe $stagingDir/
          Copy-Item README.md $stagingDir/
          Copy-Item LICENSE $stagingDir/
          Compress-Archive -Path $stagingDir/* -DestinationPath "$stagingDir.zip"

      # Alternative to the portable zip for users who don't want to unzip and
      # locate an exe themselves -- a normal double-click installer with a
      # Start Menu shortcut and Add/Remove Programs entry. Inno Setup ships
      # preinstalled on the windows-latest runner image, no extra setup step
      # needed. The zip keeps being published too -- it's what winget/Scoop
      # style package managers expect.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.tag }}"
          iscc "/DMyAppVersion=$ver" installer\polyrec.iss
          "installerPath=polyrec-$ver-windows-x64-setup.exe" >> $env:GITHUB_OUTPUT
        id: installer

      # Separate signing request from polyrec.exe's -- the installer is its
      # own PE file (with its own Authenticode signature slot), signed
      # independently even though the exe it contains is already signed too.
      - name: Upload unsigned installer for signing
        id: upload-unsigned-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-polyrec-installer
          path: ${{ steps.installer.outputs.installerPath }}

      - name: Sign installer
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: decb64a5-8938-4442-8848-36981e8328f0
          project-slug: polyrec
          signing-policy-slug: polyrec
          artifact-configuration-slug: polyrec-installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/installer

      - name: Replace unsigned installer with the signed one
        shell: pwsh
        run: Copy-Item "signed/installer/${{ steps.installer.outputs.installerPath }}" "${{ steps.installer.outputs.installerPath }}" -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem polyrec-*.zip, polyrec-*-setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath SHA256SUMS.txt -Append -Encoding ASCII
          }
          Get-Content SHA256SUMS.txt

      # Cryptographically ties this exact file to this exact repo/workflow/commit,
      # recorded in Sigstore's public transparency log -- independent of the
      # release itself, so it can't be silently re-issued alongside a swapped
      # asset the way a checksum committed only to the release body could be.
      # Verify a downloaded file with: gh attestation verify <file> -R yusukensanta/polyrec
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            polyrec-*.zip
            polyrec-*-setup.exe

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            polyrec-*.zip
            polyrec-*-setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
