[package]
name = "polyrec"
version = "0.5.133"
edition = "2024"
description = "Multi-track screen recorder for Windows"
license = "Apache-2.0"

[[bin]]
name = "polyrec"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dirs = "7"
rfd = "0.17"
windows-core = "0.62"
chrono = "0.4"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Release zips are produced by PowerShell's Compress-Archive, which only ever
# writes standard DEFLATE entries -- default-features=false + "deflate" avoids
# pulling in the bzip2/zstd/aes-crypto backends this app never needs.
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
self-replace = "1"
# The default "libappindicator" feature is the Linux tray backend; off, the
# lockfile stays free of its GTK3 bindings (unmaintained, so `cargo audit`
# would flag them) -- the Windows backend needs no feature.
tray-icon = { version = "0.26", default-features = false }
# The dashboard's HWND, for its taskbar button's badge (already a dependency
# of eframe's).
raw-window-handle = "0.6"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_Media_Audio",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Performance",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Media_MediaFoundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    # Windows' text size setting (UISettings::TextScaleFactor).
    "UI_ViewManagement",
    # Windows' accent colour (UISettings::GetColorValue).
    "UI",
    # Windows' high-contrast setting (SPI_GETHIGHCONTRAST).
    "Win32_UI_Accessibility",
    # The exe's own icon resource, for the tray's badged icons.
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_ToolHelp",
    # Named mutex and event for `single_instance`.
    "Win32_Security",
]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
# Default is 16. This app is GPU/DirectX/Media-Foundation-bound (screen
# capture, hardware video encode), not CPU-tight-loop-bound, so the extra
# cross-crate inlining/optimization opt at the default codegen-units count
# buys little here -- but it measurably slows every release build (~7-8 min
# for "Build release binary" alone in CI, dependencies fully cached). Higher
# codegen-units trades a small amount of that optimization for meaningfully
# more parallel codegen. opt-level is untouched (still fully optimized).
codegen-units = 256
